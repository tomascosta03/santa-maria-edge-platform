services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  postgres-edge:
    image: postgres:16
    environment:
      POSTGRES_DB: ${EDGE_POSTGRES_DB}
      POSTGRES_USER: ${EDGE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${EDGE_POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-edge-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/edge/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  postgres-cloud:
    image: postgres:16
    environment:
      POSTGRES_DB: ${CLOUD_POSTGRES_DB}
      POSTGRES_USER: ${CLOUD_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CLOUD_POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-cloud-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/cloud/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      EDGE_POSTGRES_DB: ${EDGE_POSTGRES_DB}
      EDGE_POSTGRES_USER: ${EDGE_POSTGRES_USER}
      EDGE_POSTGRES_PASSWORD: ${EDGE_POSTGRES_PASSWORD}
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - postgres-edge

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  sensor-simulator:
    build: ./services/sensor-simulator
    environment:
      MQTT_BROKER_HOST: mosquitto
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      - mosquitto
      - jaeger
    restart: unless-stopped

  edge-ingestion:
    build: ./services/edge-ingestion
    environment:
      MQTT_BROKER_HOST: mosquitto
      POSTGRES_HOST: postgres-edge
      EDGE_POSTGRES_DB: ${EDGE_POSTGRES_DB}
      EDGE_POSTGRES_USER: ${EDGE_POSTGRES_USER}
      EDGE_POSTGRES_PASSWORD: ${EDGE_POSTGRES_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "8001:8001"
    depends_on:
      - mosquitto
      - postgres-edge
      - jaeger
    restart: unless-stopped

  cloud-api:
    build: ./services/cloud-api
    environment:
      POSTGRES_HOST: postgres-cloud
      POSTGRES_PORT: "5432"
      CLOUD_POSTGRES_DB: ${CLOUD_POSTGRES_DB}
      CLOUD_POSTGRES_USER: ${CLOUD_POSTGRES_USER}
      CLOUD_POSTGRES_PASSWORD: ${CLOUD_POSTGRES_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "8000:8000"
    depends_on:
      - postgres-cloud
      - jaeger
    restart: unless-stopped

  edge-sync:
    build: ./services/edge-sync
    environment:
      POSTGRES_HOST: postgres-edge
      EDGE_POSTGRES_DB: ${EDGE_POSTGRES_DB}
      EDGE_POSTGRES_USER: ${EDGE_POSTGRES_USER}
      EDGE_POSTGRES_PASSWORD: ${EDGE_POSTGRES_PASSWORD}
      CLOUD_API_URL: http://cloud-api:8000/telemetry
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "8002:8002"
    depends_on:
      - postgres-edge
      - cloud-api
      - jaeger
    restart: unless-stopped

volumes:
  postgres-edge-data:
  postgres-cloud-data:
  grafana-data:
