apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-cloud-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-cloud
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-cloud
  template:
    metadata:
      labels:
        app: postgres-cloud
    spec:
      containers:
        - name: postgres-cloud
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: santa-maria-secrets, key: CLOUD_POSTGRES_DB }
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: santa-maria-secrets, key: CLOUD_POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: santa-maria-secrets, key: CLOUD_POSTGRES_PASSWORD }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-cloud-data
        - name: init-script
          configMap:
            name: postgres-cloud-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-cloud
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: postgres-cloud
  ports:
    - port: 5432
      targetPort: 5432
