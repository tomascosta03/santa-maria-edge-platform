apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-edge-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-edge
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-edge
  template:
    metadata:
      labels:
        app: postgres-edge
    spec:
      containers:
        - name: postgres-edge
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: santa-maria-secrets, key: EDGE_POSTGRES_DB }
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: santa-maria-secrets, key: EDGE_POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: santa-maria-secrets, key: EDGE_POSTGRES_PASSWORD }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-edge-data
        - name: init-script
          configMap:
            name: postgres-edge-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-edge
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: postgres-edge
  ports:
    - port: 5432
      targetPort: 5432
