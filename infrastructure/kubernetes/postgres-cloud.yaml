apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-cloud-init
  namespace: santa-maria
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS telemetry (
        id BIGSERIAL PRIMARY KEY,
        edge_record_id BIGINT NOT NULL,
        device_id TEXT NOT NULL,
        metric TEXT NOT NULL,
        value DOUBLE PRECISION NOT NULL,
        unit TEXT NOT NULL,
        is_anomalous BOOLEAN NOT NULL DEFAULT FALSE,
        received_at TIMESTAMPTZ NOT NULL,
        synced_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        UNIQUE (device_id, edge_record_id)
    );
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-cloud-data
  namespace: santa-maria
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-cloud
  namespace: santa-maria
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-cloud
  template:
    metadata:
      labels:
        app: postgres-cloud
    spec:
      containers:
        - name: postgres-cloud
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: santa-maria-secrets, key: CLOUD_POSTGRES_DB }
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: santa-maria-secrets, key: CLOUD_POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: santa-maria-secrets, key: CLOUD_POSTGRES_PASSWORD }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-cloud-data
        - name: init-script
          configMap:
            name: postgres-cloud-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-cloud
  namespace: santa-maria
spec:
  selector:
    app: postgres-cloud
  ports:
    - port: 5432
      targetPort: 5432
