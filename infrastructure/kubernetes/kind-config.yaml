kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: santa-maria
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30000
        hostPort: 3000 # Grafana
      - containerPort: 30090
        hostPort: 9090 # Prometheus
      - containerPort: 30686
        hostPort: 16686 # Jaeger UI
      - containerPort: 30800
        hostPort: 8000 # Cloud API
