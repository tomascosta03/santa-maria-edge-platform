apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-json
  namespace: santa-maria
data:
  santa-maria-overview.json: |
    {
      "title": "Santa Maria Edge Platform - Overview",
      "uid": "santa-maria-overview",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Pending Sync Queue (Edge)",
          "description": "Telemetry rows in postgres-edge with synced = false",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 8 },
          "datasource": { "type": "postgres", "uid": "postgres-edge" },
          "targets": [
            {
              "datasource": { "type": "postgres", "uid": "postgres-edge" },
              "format": "table",
              "rawSql": "SELECT count(*) AS value FROM telemetry WHERE synced = false",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 20 },
                  { "color": "red", "value": 100 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Messages Received (edge-ingestion)",
          "gridPos": { "x": 6, "y": 0, "w": 9, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "rate(edge_ingestion_messages_received_total[5m])",
              "legendFormat": "received/s",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Messages Rejected (edge-ingestion)",
          "gridPos": { "x": 15, "y": 0, "w": 9, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "rate(edge_ingestion_messages_parse_failed_total[5m])",
              "legendFormat": "parse failed/s",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "rate(edge_ingestion_messages_validation_failed_total[5m])",
              "legendFormat": "validation failed/s",
              "refId": "B"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Anomalies Detected (edge-ingestion)",
          "gridPos": { "x": 0, "y": 8, "w": 8, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "rate(edge_ingestion_anomalies_detected_total[5m])",
              "legendFormat": "anomalies/s",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Records Synced (edge-sync)",
          "gridPos": { "x": 8, "y": 8, "w": 8, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "rate(edge_sync_records_synced_total[5m])",
              "legendFormat": "synced/s",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Sync Failures (edge-sync)",
          "gridPos": { "x": 16, "y": 8, "w": 8, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "rate(edge_sync_attempts_failed_total[5m])",
              "legendFormat": "failed attempts/s",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Records Received (cloud-api)",
          "gridPos": { "x": 0, "y": 16, "w": 24, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "rate(cloud_api_telemetry_records_received_total[5m])",
              "legendFormat": "received/s",
              "refId": "A"
            }
          ]
        }
      ]
    }
