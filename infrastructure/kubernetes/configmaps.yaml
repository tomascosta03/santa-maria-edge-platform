apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: santa-maria
data:
  mosquitto.conf: |
    # Local development listener
    # Bound to all interfaces so Kubernetes can reach it
    listener 1883

    # Allow clients without authentication during local development
    listener_allow_anonymous true

    # Write broker logs to the terminal
    log_dest stdout
    log_type all
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: santa-maria
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: edge-ingestion
        static_configs:
          - targets: ["edge-ingestion:8001"]

      - job_name: edge-sync
        static_configs:
          - targets: ["edge-sync:8002"]

      - job_name: cloud-api
        static_configs:
          - targets: ["cloud-api:8000"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: santa-maria
data:
  datasources.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true

      - name: PostgreSQL Edge
        type: postgres
        uid: postgres-edge
        access: proxy
        url: postgres-edge:5432
        database: $EDGE_POSTGRES_DB
        user: $EDGE_POSTGRES_USER
        secureJsonData:
          password: $EDGE_POSTGRES_PASSWORD
        jsonData:
          sslmode: disable
          postgresVersion: 1600
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: santa-maria
data:
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: default
        folder: ""
        type: file
        options:
          path: /etc/grafana/provisioning/dashboards/json
