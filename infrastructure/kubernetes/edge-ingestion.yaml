apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-ingestion
  namespace: santa-maria
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-ingestion
  template:
    metadata:
      labels:
        app: edge-ingestion
    spec:
      containers:
        - name: edge-ingestion
          image: santa-maria/edge-ingestion:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8001
          env:
            - name: MQTT_BROKER_HOST
              value: mosquitto
            - name: POSTGRES_HOST
              value: postgres-edge
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger:4318/v1/traces
            - name: EDGE_POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: santa-maria-secrets, key: EDGE_POSTGRES_DB }
            - name: EDGE_POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: santa-maria-secrets, key: EDGE_POSTGRES_USER }
            - name: EDGE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: santa-maria-secrets, key: EDGE_POSTGRES_PASSWORD }
---
apiVersion: v1
kind: Service
metadata:
  name: edge-ingestion
  namespace: santa-maria
spec:
  selector:
    app: edge-ingestion
  ports:
    - port: 8001
      targetPort: 8001
